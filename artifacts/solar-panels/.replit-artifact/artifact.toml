kind = "mobile"
previewPath = "/"
title = "Distanciamento de Painéis Fotovoltaicos"
version = "1.0.0"
id = "artifacts/solar-panels"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20703

[services.development]
run = "pnpm --filter @workspace/solar-panels run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solar-panels", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/solar-panels", "run", "serve" ]

[services.env]
PORT = "20703"
BASE_PATH = "/"
